version: '3'
services:
  api:
    image:  lunale/ordboxcompany:api-latest
    restart: always
    expose:
      - 80
    volumes:
      - /home/ordboxcompany/docker-compose-files/front/app/wwwroot/Production:/app/wwwroot/media/doc:rw
      - /home/ordboxcompany/docker-compose-files/front/app/wwwroot/media:/app/wwwroot/media:rw
      - /home/ordboxcompany/docker-compose-files/front/app/PrivateFiles/media:/app/PrivateFiles/media:rw
      - /home/ordboxcompany/docker-compose-files/front/app/logs:/app/logs:rw
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-ordbox.rule=Host(`api.ordboxcompany.lunale.com.ar`)"
      - "traefik.http.routers.api-ordbox.entrypoints=web"

  front:
    image: lunale/ordboxcompany:front-latest
    restart: always
    expose:
      - 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    environment:
      API_URL: 'http://api.ordboxcompany.lunale.com.ar'
      API_VERSION: "1"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front-apasionados.rule=Host(`ordboxcompany.lunale.com.ar`)"
      - "traefik.http.routers.front-apasionados.entrypoints=web"
      
  networks:
  traefik_proxy:
    external: true

